spring:
  application:
    name: barbearia-api
server:
  port: 8080
  datasource:
    url: jdbc:postgresql://localhost:5432/barbearia
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

