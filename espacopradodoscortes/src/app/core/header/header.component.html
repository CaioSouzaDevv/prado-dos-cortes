<header class="header">
    <div class="container">
        <div class="wrapper">


            <div class="d-flex justify-content-between align-items-center" id="menu">
                <a href="/" class="header__brand" aria-label="Página inicial - Espaço Prado dos Cortes">
                    <figure class="header__logo">
                        <svg class="secondary-color" xmlns="http://www.w3.org/2000/svg" width="32" height="32"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <circle cx="6" cy="6" r="3"></circle>
                            <path d="M8.12 8.12 12 12"></path>
                            <path d="M20 4 8.12 15.88"></path>
                            <circle cx="6" cy="18" r="3"></circle>
                            <path d="M14.8 14.8 20 20"></path>
                        </svg>
                        <span class="header__title">Espaço Prado dos Cortes</span>
                    </figure>
                </a>

                <i class="fa-solid fa-bars fa-solid header__icon" (click)="toggleMenu()" aria-label="Abrir menu"
                    role="button" tabindex="0"></i>
                <nav class="header__nav" aria-label="Menu principal" [class.open]="isMenuOpen">

                    <ul class="header__menu list-unstyled d-flex gap-3 mb-0">
                        <li class="header__menu-item"><a href="#home" class="header__menu-link"
                                title="Ir para a página inicial">Home</a></li>
                        <li class="header__menu-item"><a href="#services" class="header__menu-link"
                                title="Veja nossos serviços">Serviços</a></li>
                        <li class="header__menu-item"><a href="#testimontial" class="header__menu-link"
                                title="Leia depoimentos de clientes">Depoimentos</a></li>
                        <li class="header__menu-item"><a href="#history" class="header__menu-link"
                                title="Conheça nossa história">História</a></li>
                        <li class="header__menu-item"><a href="#contact" class="header__menu-link"
                                title="Entre em contato conosco">Contato</a></li>
                        <li class="header__menu-item">
                            <a href="#agendar" class="btn btn--secondary" title="Agendar um horário">Agendar</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</header>
